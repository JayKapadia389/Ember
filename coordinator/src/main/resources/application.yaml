spring:
  application:
    name: coordinator
  datasource:
    url: jdbc:postgresql://localhost:5432/ember
    username: postgres
    password: admin
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

ember:
  artifacts:
    dir: ./data/artifacts
