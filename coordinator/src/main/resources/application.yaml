spring:
  application:
    name: coordinator
  datasource:
    url: jdbc:postgresql://localhost:5432/ember
    username: postgres
    password: admin
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
